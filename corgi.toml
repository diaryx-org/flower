# corgi: one build store for the machine, shared by every checkout
# (https://corgi.build). Cargo reads none of this; it is corgi's alone.
#
# The libraries and the Python are unit's and diaryx's corgi.toml's, to the
# hash, so what flower shares with them (Blitz, Stylo, fontconfig) is built
# once for all three. CI builds with cargo, and so does a machine without
# corgi.

# The glibc a Linux build links against, as diaryx's.
glibc = "2.38"

# Files a package reads beyond the `.rs` files in its own directory, relative
# to the package. A test's file missing here is a cached pass that outlives an
# edit to it.
# Files a package reads beyond the `.rs` files in its own directory, relative
# to the package. A test's file missing here is a cached pass that outlives an
# edit to it.
[extra-inputs]
# The sample and its pictures, which an untitled document and the PDF tests
# read, the corpus, and the bundle's property list, which build.rs reads.
flower-app = ["Info.plist", "resources/*", "resources/Media/*", "corpus/*"]
# The picture its tests draw in cells.
flower-tui = ["../../leaf-gpui.png"]
# The document the browser opens on, compiled in.
flower-web = ["demo.md"]
# The face its text tests measure with, compiled in.
flower-doc-editor = ["tests/faces/*"]
# The patched wgpu-hal (patches/wgpu-hal): the shaders its GLES backend
# compiles in.
wgpu-hal = ["src/gles/shaders/*"]
# The workspace it checks: every member has a row in `ISOLATED`.
xtask = ["../Cargo.toml", "../crates/*/Cargo.toml", "../apps/*/Cargo.toml"]

# fontconfig and what it is linked with (Blitz's text, through
