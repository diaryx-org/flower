# UniFFI Swift binding config. The defaults already produce a clean surface
# (`FlowerDoc`, `DocView`/`RowView`, `FlowerError`); this only pins names so the
# generated C shim and the Swift package layer stay stable if the crate is
# renamed.
[bindings.swift]
# The C-shim module the generated Swift imports (`import flower_ffiFFI`). Matches
# the modulemap the scripts bundle into the package's headers dir.
ffi_module_name = "flower_ffiFFI"
# The dylib/staticlib symbol prefix — must match the crate's lib name.
cdylib_name = "flower_ffi"

# Kotlin's generated exception classes already have a `message` (Throwable's),
# so a variant field of that name is declared twice and the binding does not
# compile. Kotlin alone calls it `reason`; Swift keeps `message`.
[bindings.kotlin.rename]
"FlowerError.Open.message" = "reason"
