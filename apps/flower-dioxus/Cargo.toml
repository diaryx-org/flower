# Flower on Dioxus's native renderer (Blitz): the `flower-dioxus` editor
# widget (crates/flower-dioxus) in a window, with the file around it — open,
# save, save as, the zoom and the window title — as crates/flower-tui is the
# terminal's host over flower-ratatui.
#
# A workspace of its own, like the widget's: `dioxus-native` is published only
# as 0.8.0-alpha.3, which pins a winit beta and a large wgpu tree that nothing
# in flower's root workspace should resolve. Build it by manifest:
#
#     cargo run --manifest-path apps/flower-dioxus/Cargo.toml -- config.toml
[workspace]

[package]
# Not `flower-dioxus`, which is the widget's name: one graph cannot hold two
# packages by one name. The binary keeps it.
name = "flower-dioxus-app"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "flower-dioxus"
path = "src/main.rs"

[dependencies]
flower-dioxus = { path = "../../crates/flower-dioxus" }
flower-core = { path = "../../crates/flower-core" }
# diaryx-org's components for Dioxus: the root the editor's controls sit
# under, its overlay for the prompts and toasts, and the toolbar's controls.
# `apple`: the accent and highlight chosen in System Settings, on a Mac.
unit = { git = "https://github.com/diaryx-org/unit", branch = "main", features = ["apple"] }
dioxus = { version = "0.8.0-alpha.3", default-features = false, features = [
    "macro",
    "html",
    "signals",
    "hooks",
] }
# dioxus-native's defaults, but the classic `vello` renderer for
# `vello-hybrid`, which the widget asks for (its Cargo.toml says why), and
# without `hot-reload`.
dioxus-native = { version = "0.8.0-alpha.3", default-features = false, features = [
    "accessibility", "net", "html", "svg", "system-fonts", "clipboard", "file-dialog",
    "woff", "text-transform-icu", "apple-font-embolden", "vello",
] }
# File dialogs and the unsaved-changes question. Already in the tree through
# Blitz's own `file-dialog` feature.
rfd = "0.17"
# The menu bar (`menu.rs`): Tauri's, the native NSMenu on macOS. Without its
# default GTK backend: Linux shows no menu bar, and the menu still builds and
# is tested there without GTK's system libraries.
muda = { version = "0.21", default-features = false }
# The menu bar's poll. Already in the tree: dioxus-native's `net` builds and
# enters a tokio runtime with timers enabled.
tokio = { version = "1", default-features = false, features = ["time"] }
# The clipboard, for ⌘V into an open value. Already in the tree through
# Blitz's own `clipboard` feature.
arboard = "3.7"

# The application delegate that hears which files the Finder asks the app to
# open (`finder.rs`): AppKit and Foundation, at the versions winit-appkit
# already uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "NSArray", "NSEnumerator", "NSObject", "NSString", "NSURL",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "NSApplication", "NSResponder",
] }

# winit's macOS backend, patched (its `PATCH.md`): unpatched, its text input
# client answers no questions about the text around the caret, so the
# press-and-hold accent menu never opens, and it drops the emoji picker's
# text. The editor tells the input method that text (crates/flower-dioxus's
# `ime.rs`). From diaryx-org's Blitz fork, where the org keeps its patched
# Blitz stack, winit included (`patches/` there); cargo finds the crate by
# name wherever it sits in that repository. It goes when the change lands in
# a winit that dioxus-native takes.
[patch.crates-io]
# Blitz from diaryx-org's fork, its `leaf` branch at the version
# dioxus-native pins, as unit and leaf take it (FORK.md there): its
# accessibility tree reads ARIA's roles and states and carries out assistive
# tech's press, a node removed under `display: none` is forgotten by its
# layout parent, and a press focuses what it lands on. Every Blitz crate in
# the graph comes from the fork, as the fork's crates depend on each other by
# path.
blitz-dom = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
blitz-traits = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
blitz-shell = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
blitz-paint = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
blitz-net = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
stylo_taffy = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
debug_timer = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
accesskit_xplat = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
winit-appkit = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
