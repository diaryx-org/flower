[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
# Zig-backed config AST + lossless editor (default features: json/yaml/toml/fig).
fig = { path = "../fig/bindings/rust/fig" }
ratatui = "0.29"
anyhow = "1"
# Internal crates.
flower-core = { path = "crates/flower-core" }
flower-ratatui = { path = "crates/flower-ratatui" }
