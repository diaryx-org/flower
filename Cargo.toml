[workspace]
resolver = "3"
# Listed rather than globbed: xtask's test that every member is built alone by
# the `package-isolation` job reads this line, and each member's manifest from
# it. A glob would leave it with nothing to read.
members = [
  "crates/flower-core",
  "crates/flower-ratatui",
  "crates/flower-tui",
  "crates/flower-ffi",
  "xtask",
]

[workspace.package]
edition = "2024"
version = "0.6.4"
# Minimum supported Rust version, enforced by the `msrv` CI job (which reads this
# very value). Edition 2024 needs 1.85, but `flower-core` uses an `if let … && let …`
# let-chain in a stable position, stabilized in 1.88 — so 1.88 is the true floor.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/diaryx-org/flower"
readme = "README.md"

[workspace.dependencies]
# Config AST + lossless editor (pure Rust since fig 7). fig's core names no
# language (fig 6): a `fig::Format` is a handle a language crate hands back when
# it registers, so flower depends on the crate of each format it opens, each
# without serde.
fig = "7"
fig-json = { version = "7", default-features = false, features = ["fig"] }
fig-yaml = { version = "7", default-features = false, features = ["fig"] }
fig-toml = { version = "7", default-features = false, features = ["fig"] }
fig-zon = { version = "7", default-features = false, features = ["fig"] }
fig-figl = { version = "7", default-features = false, features = ["fig"] }
# The generic, prov-agnostic schema engine — the library alone, without its CLI
# (0.5 is its fig 7 release).
fig-schema = { version = "0.5", default-features = false }
ratatui = "0.29"
anyhow = "1"
# Internal crates.
flower-core = { path = "crates/flower-core", version = "0.6.4" }
flower-ratatui = { path = "crates/flower-ratatui" }
