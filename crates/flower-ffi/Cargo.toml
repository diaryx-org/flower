[package]
name = "flower-ffi"
version.workspace = true
edition.workspace = true
description = "C-ABI / Swift frontend binding for flower: wraps the filesystem-free flower-core Model behind UniFFI so an AppKit/SwiftUI app can drive the structural config tree — navigate mappings/sequences/scalars and commit path-addressed, lossless edits through fig. Its view projection is generic over the backend, so an embedder with its own can reuse it under its own bindings."

# Published, the same way `leaf-ffi` is. The UniFFI handle is only half of what
# is in here: the other half is the projection from a `Model` to the flat view
# records a binding renders, which is generic over the backend and is the part
# an embedder with its own `Backend` needs. Left unpublished, every such
# embedder would copy `pages_of` and then drift from it.

# staticlib -> the .a linked into the app (and force-loaded for tests).
# cdylib    -> a .dylib for a host build and for `uniffi-bindgen --library` to
#              introspect the embedded UniFFI metadata.
# lib       -> lets `cargo test` and the in-tree bindgen bin see the crate.
[lib]
crate-type = ["staticlib", "cdylib", "lib"]

# The bindings generator, kept in-tree so its version can never drift from the
# `uniffi` runtime this crate links. Run via `scripts/*.sh`:
#   cargo run -p flower-ffi --bin uniffi-bindgen -- \
#     generate --library <dylib> --language swift --out-dir <dir>
[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
# The frontend-neutral structural model. No filesystem concept of its own — the
# host owns file I/O, drives the tree, and persists `source()`.
flower-core.workspace = true
fig.workspace = true

# The FFI machinery: `proc-macro` mode (no .udl file) — the view structs derive
# `Record`, the handle derives `Object`, and `setup_scaffolding!()` emits the C
# ABI. `cli` pulls in `uniffi_bindgen_main` for the bin target above.
uniffi = { version = "0.28", features = ["cli"] }
thiserror = "1"
