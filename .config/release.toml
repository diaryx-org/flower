# What the shared release tooling needs to know about flower. Everything not
# stated here is a default in lib/repo.nu — the manifest, the changelog path,
# the cliff config, and that this is a Cargo workspace.
name = "flower"
url = "https://github.com/diaryx-org/flower"
release_branch = "main"

# What to run before cutting. Each repo owns its own CI; this names it.
verify = "cargo xtask ci"

# The app's marketing version follows the workspace version, and no manifest
# parser in the tooling reaches an Xcode setting — so the bump runs the task
# that writes it, and the file is staged with the release commit. The
# `app-version` CI job checks they agree.
post_bump = "cargo xtask sync-versions"
extra_version_files = ["apps/flower-editor/project.yml"]

# What pushing the tag sets off, most consequential first. The warning printed
# before the push is handed back to you is composed from these.
[[tag_starts]]
workflow = "publish.yml"
does = "uploads every publishable crate to crates.io"

[[tag_starts]]
workflow = "homebrew.yml"
does = "builds the `flower` CLI binaries and writes the tap formula"
