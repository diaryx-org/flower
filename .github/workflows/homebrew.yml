name: Homebrew
# Release the `flower` TUI editor to Homebrew. The build/attach/render/push
# mechanics are shared with fig, twig, moid, and prov and live in
# diaryx-org/.github; only what makes flower different is below.
#
# flower is a Rust workspace and the CLI is `flower-tui`, whose binary is named
# `flower` — hence `cargo-package` and `name` differing. That crate is
# `publish = false` and stays that way: Homebrew builds from this tag's tree,
# not from crates.io, so the binary ships without the crate ever being uploaded.
# publish.yml still handles the registry half (flower-core, flower-ffi) off the
# same tag.
#
# `needs-zig: true` because flower depends on fig -> fig-sys, which ships
# prebuilt payload crates for aarch64-apple-darwin, x86_64-unknown-linux-gnu,
# aarch64-unknown-linux-gnu, x86_64-pc-windows-msvc, and wasm32 — and for
# nothing else. The `macos-x86_64` leg of the matrix is not on that list, so its
# build.rs falls back to compiling libfig.a from the vendored Zig source. One of
# the four legs needs a Zig toolchain; the other three ignore it. The version is
# the shared default, 0.16.0, which is what ci.yml and publish.yml pin.
#
# No `rust-toolchain:` — flower has no rust-toolchain.toml, and its CI builds on
# `stable`, which is what this input already defaults to. (The workspace's
# `rust-version = "1.88"` is the MSRV the `msrv` CI job enforces, not a pin on
# what releases are built with.)
#
# No `wasi:` — flower is a terminal app that wants a tty. A wasm32-wasip1 build
# would compile and be useless.
#
# Runs on the same `v*.*.*` tag as publish.yml. Both use
# softprops/action-gh-release semantics via the shared workflow, which upserts
# the Release without touching notes, so the two don't conflict.
#
# Prerequisite before the first tagged release: install the diaryx-bot GitHub
# App on diaryx-org/homebrew-tap (Contents:write) and add its App ID + private
# key as the TAP_APP_ID / TAP_APP_KEY secrets on this repo.
on:
  push: { tags: [v*.*.*] }
  workflow_dispatch:
permissions:
  contents: write # caps what the called workflow may request
jobs:
  homebrew:
    uses: diaryx-org/.github/.github/workflows/reusable-homebrew.yml@main
    with:
      name: flower
      desc: "Structural terminal editor for JSON, YAML, TOML, ZON, and fig config"
      language: rust
      cargo-package: flower-tui
      needs-zig: true
    secrets:
      TAP_APP_ID: ${{ secrets.TAP_APP_ID }}
      TAP_APP_KEY: ${{ secrets.TAP_APP_KEY }}
