[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/diaryx-org/flower"
readme = "README.md"

[workspace.dependencies]
# Zig-backed config AST + lossless editor.
fig = "3"
# The generic, prov-agnostic schema engine
fig-schema = "0.1.1"
ratatui = "0.29"
anyhow = "1"
# Internal crates.
flower-core = { path = "crates/flower-core", version = "0.1.0" }
flower-ratatui = { path = "crates/flower-ratatui" }
