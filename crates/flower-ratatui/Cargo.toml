[package]
name = "flower-ratatui"
edition.workspace = true
version.workspace = true
description = "A ratatui widget that renders and drives flower-core's config tree."
# Not on crates.io: a ratatui widget pinned to one ratatui minor, whose only
# consumer is `flower-tui` in this workspace. Publishing it would be a second
# version number to keep in step for no reader outside the repo.
publish = false

[dependencies]
flower-core.workspace = true
ratatui.workspace = true

[dev-dependencies]
# `TestBackend` renders a frame into a buffer, so the page layout is checked
# by what it actually draws rather than by the model it draws from.
fig.workspace = true
