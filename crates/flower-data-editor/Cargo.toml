# flower-data-editor — the embeddable page editor for Dioxus's native renderer
# (Blitz): flower-data's page projection drawn by an HTML/CSS engine on wgpu,
# with no webview. `apps/flower` hosts it for a data file, beside
# flower-doc-editor for a document.
#
#     cargo test -p flower-data-editor
[package]
name = "flower-data-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Embeddable Dioxus-native structural config editor widget for flower: the page view, its keys and its edit line, over flower-data."
publish = false

[dependencies]
dioxus = { version = "0.8.0-alpha.3", default-features = false, features = [
    "macro",
    "html",
    "signals",
    "hooks",
] }
# What the editor needs Blitz to do to draw it correctly, and no more; the rest
# of dioxus-native's features are the host's to choose.
#
# - `system-fonts`: the stylesheet names the system's monospace faces.
# - `vello`, the classic renderer, not the default `vello-hybrid`, which cannot
#   draw a bitmap glyph (a colour emoji in a value draws as nothing). Also what
#   flower-doc-editor asks for, so a host carrying both builds one renderer.
dioxus-native = { version = "0.8.0-alpha.3", default-features = false, features = [
    "system-fonts", "vello",
] }
flower-data.workspace = true
# fig's `Value`, which flower-data's model hands out: whether a container is
# a mapping, which takes a field, or a list, which takes an item. Already in
# the tree through flower-data, at its version.
fig.workspace = true
# diaryx-org's components for Dioxus, which work on Blitz and are read by
# assistive tech: every control on a page (its rows and sections, switches,
# selects, chips and buttons), the picker's modal, the row's context menu,
# the prompts for a key, and the pages' scrolling (`unit::scroll`). Only
# Dioxus beneath it.
unit = { git = "https://github.com/diaryx-org/unit", branch = "main" }

[dev-dependencies]
fig-toml.workspace = true
fig-yaml.workspace = true
