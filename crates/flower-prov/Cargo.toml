[package]
name = "flower-prov"
edition.workspace = true
version.workspace = true
description = "A flower-core Backend that edits a prov document's embedded metadata."

[dependencies]
flower-core.workspace = true
fig.workspace = true
# The prov library (sibling checkout). Its default `yaml` feature forwards to
# fig/yaml; fig unifies with flower's copy (same crates.io source).
prov = { path = "../../../prov/prov" }

[dev-dependencies]
# The body editor, for the full-round-trip integration test only. No-default:
# we drive it through `from_source`/`source` (no filesystem), as leaf-core's own
# docs prescribe for an embedding host. Its twig-doc unifies with prov's.
leaf-core = { path = "../../../leaf/crates/leaf-core", default-features = false }
