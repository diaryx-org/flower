[workspace]
resolver = "3"
# Listed rather than globbed: `xtask` is flower's CI as a program, and both the
# CI matrix and the publish order are derived from this line by reading each
# member's manifest. A glob would leave those two with nothing to read.
members = [
  "crates/flower-core",
  "crates/flower-ratatui",
  "crates/flower-tui",
  "crates/flower-ffi",
  "xtask",
]

[workspace.package]
edition = "2024"
version = "0.2.0"
# Minimum supported Rust version, enforced by the `msrv` CI job (which reads this
# very value). Edition 2024 needs 1.85, but `flower-core` uses an `if let … && let …`
# let-chain in a stable position, stabilized in 1.88 — so 1.88 is the true floor.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/diaryx-org/flower"
readme = "README.md"

[workspace.dependencies]
# Zig-backed config AST + lossless editor.
fig = "3"
# The generic, prov-agnostic schema engine
fig-schema = "0.2.0"
ratatui = "0.29"
anyhow = "1"
# Internal crates.
flower-core = { path = "crates/flower-core", version = "0.2.0" }
flower-ratatui = { path = "crates/flower-ratatui" }
