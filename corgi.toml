# Stylo's Python on an x86_64 Linux host.
[tools.python3-x86_64]
version = "3.13.18"
url = "https://github.com/astral-sh/python-build-standalone/releases/download/20261026/cpython-3.13.18%2B20261026-x86_64-unknown-linux-gnu-install_only.tar.gz"
sha256 = "126343c54daff4068efc1ac269518d0cc202d57857794948103dd1454e8881be"
bin = "python/bin/python3"
command = "python3"
env = "PYTHON3"
packages = ["stylo"]
targets = ["x86_64-unknown-linux-gnu"]

# Stylo (Blitz's CSS engine) generates its style system with Python.
[tools.python3]
version = "3.13.18"
url = "https://github.com/astral-sh/python-build-standalone/releases/download/20261026/cpython-3.13.18%2B20261026-aarch64-unknown-linux-gnu-install_only.tar.gz"
sha256 = "b48451865bde9a39e2f3e71d7fdcbf1f32615f50f24d78dc50d04ede6501cf81"
bin = "python/bin/python3"
env = "PYTHON3"
packages = ["stylo"]
# The targets Stylo is built for on this host: the Python runs on the host
# whichever one it is, so the browser's build (`web` in .config/ship.figl)
# takes it too. An x86_64 host's entry above would need the same, on a
# machine that has corgi.
targets = ["aarch64-unknown-linux-gnu", "wasm32-unknown-unknown"]

# Feature roots: the package sets features are resolved across. Without one,
# corgi resolves the whole workspace as one, which is how every lane but the
# browser's builds it. In a browser the host and the widget are each built
# alone, as `cargo clippy -p` builds them: `web` is the host
# (apps/flower-web), which takes the widget without the system clipboard and
# on the hybrid renderer, and `web-widget` the widget by itself, in the
# features a browser host gives it. `.config/ship.figl`'s `web` job passes
# them; scripts/cargo.sh drops `--root` where it runs cargo.
[roots.web]
packages = ["flower-web"]

[roots.web-widget]
packages = ["flower-doc-editor"]
