[package]
name = "flower-tui"
edition.workspace = true
version.workspace = true
description = "Terminal app: a structural config editor on flower-core + flower-ratatui + fig."
# Not on crates.io while flower is a prototype: the binary is `cargo run -p
# flower-tui` from a checkout, and the published surface is `flower-core` alone.
publish = false

[[bin]]
name = "flower"
path = "src/main.rs"

[dependencies]
flower-core.workspace = true
flower-ratatui.workspace = true
fig.workspace = true
ratatui.workspace = true
anyhow.workspace = true
