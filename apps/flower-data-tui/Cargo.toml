[package]
name = "flower-data-tui"
edition.workspace = true
version.workspace = true
description = "Terminal app: a structural config editor on flower-data + flower-ratatui + fig."
# Not on crates.io, like the rest of flower: the binary is `cargo run -p
# flower-data-tui` from a checkout.
publish = false

[[bin]]
name = "flower"
path = "src/main.rs"

[dependencies]
flower-data.workspace = true
flower-ratatui.workspace = true
fig.workspace = true
ratatui.workspace = true
anyhow.workspace = true
