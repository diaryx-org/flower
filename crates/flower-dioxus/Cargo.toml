# flower-dioxus — the embeddable page editor for Dioxus's native renderer
# (Blitz): flower-core's page projection drawn by an HTML/CSS engine on wgpu,
# with no webview. `apps/flower-dioxus` is one host for it; leaf's Dioxus
# editor, showing a document's frontmatter, is meant to be another.
#
# A workspace of its own, and not a member of flower's root one: `dioxus-native`
# is published only as 0.8.0-alpha.3, which pins a winit beta and a large wgpu
# tree that nothing in the root workspace should resolve. The same split, for
# the same reason, as leaf's `crates/leaf-dioxus`.
#
#     cargo test --manifest-path crates/flower-dioxus/Cargo.toml
[workspace]

[package]
name = "flower-dioxus"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/diaryx-org/flower"
description = "Embeddable Dioxus-native structural config editor widget for flower: the page view, its keys and its edit line, over flower-core."
publish = false

[dependencies]
dioxus = { version = "0.8.0-alpha.3", default-features = false, features = [
    "macro",
    "html",
    "signals",
    "hooks",
] }
# What the editor needs Blitz to do to draw it correctly, and no more; the rest
# of dioxus-native's features are the host's to choose.
#
# - `system-fonts`: the stylesheet names the system's monospace faces.
# - `vello`, the classic renderer, not the default `vello-hybrid`, which cannot
#   draw a bitmap glyph (a colour emoji in a value draws as nothing). Also what
#   leaf-dioxus asks for, so a host carrying both builds one renderer.
dioxus-native = { version = "0.8.0-alpha.3", default-features = false, features = [
    "system-fonts", "vello",
] }
flower-core = { path = "../flower-core" }
# fig's `Value`, which flower-core's model hands out: whether a container is
# a mapping, which takes a field, or a list, which takes an item. Already in
# the tree through flower-core, at its version.
fig = "7"
# diaryx-org's components for Dioxus, which work on Blitz and are read by
# assistive tech: every control on a page (its rows and sections, switches,
# selects, chips and buttons), the picker's modal, the row's context menu,
# the prompts for a key, and the pages' scrolling (`unit::scroll`). Only
# Dioxus beneath it.
unit = { git = "https://github.com/diaryx-org/unit", branch = "main" }

[dev-dependencies]
fig-toml = { version = "7", default-features = false, features = ["fig"] }
fig-yaml = { version = "7", default-features = false, features = ["fig"] }

# Blitz, stylo and wgpu with their debug info are most of a debug build:
# gigabytes, which a CI runner's disk has little room for. Only this
# workspace's own crate keeps its debug info; a backtrace still names every
# function.
[profile.dev.package."*"]
debug = false

# Blitz from diaryx-org's fork, its `leaf` branch at the version
# dioxus-native pins, as unit and leaf take it (FORK.md there): its
# accessibility tree reads ARIA's roles and states, a node removed under
# `display: none` is forgotten by its layout parent, and a press focuses what
# it lands on. Every Blitz crate in the graph comes from the fork, as the
# fork's crates depend on each other by path. A [patch] applies only at the
# root of the workspace that has it, so a host patches its own, as
# apps/flower-dioxus does.
[patch.crates-io]
blitz-dom = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
blitz-traits = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
blitz-shell = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
blitz-paint = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
stylo_taffy = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
debug_timer = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
